<style>

.inp,select,textarea{width:100%;font-size:16px;min-height:46px;border:1px solid #c9d1dd;border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);font-family:inherit}

.pcard{background:#fff;border-radius:14px;border:1px solid var(--line);padding:8px;scroll-margin-top:4px}

.cc{border-radius:10px;padding:4px;text-align:center}

.cc .bb{display:flex;gap:4px}

/* 集計テーブル */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid var(--line);border-radius:12px}
table.st{border-collapse:separate;border-spacing:0;min-width:100%;font-variant-numeric:tabular-nums}
table.st th,table.st td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:#fff;font-size:15px}

table.st thead th small{display:block;color:#98a2b3}
table.st thead th.hs{background:var(--sv2)}table.st thead th.hp{background:var(--sp2)}
table.st thead th.sorted{box-shadow:inset 0 -3px 0 var(--pri)}
table.st .c-name{position:sticky;left:0;z-index:1;text-align:left;font-weight:700;box-shadow:2px 0 0 var(--line)}
table.st tfoot td,table.st tfoot th{background:#fff8e6;font-weight:800}
table.st td.evc{font-weight:800;min-width:92px;position:relative}
.bar{position:absolute;left:6px;right:6px;bottom:3px;height:4px;border-radius:2px;background:#eef1f5;overflow:hidden}

.rank1{background:#fff3c4 !important}

/* モーダル */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mdlg{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mdlg.wide{max-width:720px}
.mhd{font-weight:800;font-size:17px;padding:14px 16px 6px}

details summary{cursor:pointer;font-weight:700;padding:8px 0}

<body>
<header id="topbar"><a id="backbtn" class="back" href="#home" hidden>‹ 戻る</a><h1 id="ttl">バレー記録</h1><span id="savest">保存済み</span></header>
<main id="app"><p class="muted">読み込み中…</p></main>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
'use strict';
/* =========================================================
   バレーボール プレー記録・選手別成績管理  v1.0.0
   - データは端末内 IndexedDB に保存（予備として localStorage にも複製）
   - 外部ライブラリ・外部通信なし
   ========================================================= */
const APP_VERSION = '1.0.0';
const MAX_ACTIVE = 30;
const MAX_SETS = 15;
const LABEL = ['サーブ打数','サーブミス','サービスエース','有効サーブ','スパイク本数','スパイク得点','スパイク失点'];
const SHORT = ['打数','ミス','エース','有効','本数','得点','失点'];
const COLS = ['B','C','D','E','F','G','H'];
const KINDS = ['公式戦','練習試合','練習','その他'];
const WD = '日月火水木金土';
const DEFAULT_SETTINGS = { teamName: '町田高校 男子バレー部', linkServe: false, linkSpike: false, viewMode: 'auto' };

/* ---------------- 計算 ---------------- */
const zero = () => [0,0,0,0,0,0,0];
function addInto(a, b){ for (let i=0;i<7;i++) a[i] += (b && +b[i]) || 0; return a; }
// I列：（サービスエース×1.5 ＋ 有効サーブ×1 － サーブミス×1）÷ サーブ打数 × 100
function serveEval(s){ const n = s[0]; if (!n) return 0; return (s[2]*1.5 + s[3] - s[1]) / n * 100; }
// J列：（スパイク得点 － スパイク失点）÷ スパイク本数 × 100
function spikeEval(s){ const n = s[4]; if (!n) return 0; return (s[5] - s[6]) / n * 100; }
function fmtPct(v){
  if (typeof v !== 'number' || !isFinite(v)) return '0%';
  const r = Math.round(Math.abs(v) * 10 + 1e-9) / 10;
  if (r === 0) return '0%';
  return (v < 0 ? '-' : '') + r.toFixed(1) + '%';
}
function fmtDiff(v){ const s = fmtPct(v); return (v > 0 && s !== '0%') ? '+' + s : s; }

/* ---------------- ユーティリティ ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(ds){ if (!ds) return ''; const [y,m,d] = ds.split('-').map(Number); const w = new Date(y, m-1, d).getDay(); return `${y}/${m}/${d}(${WD[w]})`; }
function fy(ds){ const y = +ds.slice(0,4), m = +ds.slice(5,7); return m >= 4 ? y : y - 1; }   // 年度（4月始まり）
function fyRange(y){ return [`${y}-04-01`, `${y+1}-03-31`]; }
function numKey(n){ const v = parseInt(n, 10); return isNaN(v) ? 9999 : v; }
function gradeLabel(g){ return g ? (/^\d$/.test(String(g)) ? g + '年' : g) : ''; }
function toast(msg, ms=2200){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
function safeFile(s){ return String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 60); }

/* ---------------- 状態 ---------------- */
const S = { players: new Map(), seasons: new Map(), matches: new Map(), settings: { ...DEFAULT_SETTINGS }, lastBackup: null, lastSnapDate: null };
const ui = { nm: null, stats: { mode: 'match' }, per: null, sort: { key: 'num', dir: 1 }, undo: [], cur: null, lastMode: null };

/* ---------------- 保存（IndexedDB ＋ localStorage 予備） ---------------- */
const DB_NAME = 'vb-stats-db', DB_VER = 1, MIRROR_KEY = 'vb-stats-mirror';
let db = null, fallback = false;
function openDB(){
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB非対応'));
    let r; try { r = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('players')) d.createObjectStore('players', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('seasons')) d.createObjectStore('seasons', { keyPath: 'year' });
      if (!d.objectStoreNames.contains('matches')) d.createObjectStore('matches', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
      if (!d.objectStoreNames.contains('snapshots')) d.createObjectStore('snapshots', { keyPath: 'id', autoIncrement: true });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
function tx(stores, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(stores, mode); let out;
    const rq = fn(t);
    if (rq && 'onsuccess' in rq) rq.onsuccess = () => { out = rq.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('abort'));
  });
}
let chain = Promise.resolve(), pending = 0;
function queue(fn){
  pending++; setSaveState('saving');
  const p = chain.then(fn);
  chain = p.then(() => { pending--; if (!pending) setSaveState('saved'); scheduleMirror(); },
                 (e) => { pending--; console.error(e); setSaveState('error'); scheduleMirror(); });
  return p;
}
const dirty = { players: new Set(), seasons: new Set(), matches: new Set(), meta: new Set(), del: [] };
let flushQueued = false;
function markDirty(store, key){ dirty[store].add(key); scheduleFlush(); }
function markDelete(store, key){ dirty[store].delete(key); dirty.del.push([store, key]); scheduleFlush(); }
function scheduleFlush(){
  if (flushQueued) return; flushQueued = true;
  queue(async () => {
    flushQueued = false;
    if (fallback) { writeMirror(); return; }
    const items = [];
    for (const k of dirty.players) { const v = S.players.get(k); if (v) items.push(['players', v]); }
    for (const k of dirty.seasons) { const v = S.seasons.get(k); if (v) items.push(['seasons', v]); }

/* ---------------- ファイル受け渡し（共有 / ダウンロード） ---------------- */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
}
function deliver(blob, filename, onDone){
  let file = null; try { file = new File([blob], filename, { type: blob.type }); } catch (e) {}
  const canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
  const btns = [{ label: '閉じる' }];
  btns.push({ label: 'ダウンロード', cls: canShare ? '' : 'pri', onClick: () => { downloadBlob(blob, filename); onDone && onDone(); } });
  if (canShare) btns.push({ label: '共有・保存', cls: 'pri', onClick: async () => { try { await navigator.share({ files: [file], title: filename }); onDone && onDone(); } catch (e) { if (e && e.name !== 'AbortError') { downloadBlob(blob, filename); onDone && onDone(); } } } });
  modal({ title: 'ファイルの準備ができました', html: `<p class="msg"><b>${esc(filename)}</b><br><span class="muted">${(blob.size / 1024).toFixed(1)} KB</span></p><p class="muted">「共有・保存」→「"ファイル"に保存」やLINE・メールで送れます。パソコンでは「ダウンロード」を使ってください。</p>`, buttons: btns });
}

function thead(){
  return `<thead><tr><th class="c-name"><small>A</small>選手名</th>${LABEL.map((l, i) => `<th class="${i < 4 ? 'hs' : 'hp'}"><small>${COLS[i]}</small>${l}</th>`).join('')}<th class="hs"><small>I</small>サーブ評価</th><th class="hp"><small>J</small>スパイク評価</th></tr></thead>`;
}
function ctr(pid, k, v){ return `<div class="ctr"><button class="bm" data-act="dec" data-pid="${pid}" data-k="${k}" aria-label="${LABEL[k]} −1">−</button><span class="val" id="v_${pid}_${k}">${v}</span><button class="bp ${k < 4 ? 'sv' : 'sp'}" data-act="inc" data-pid="${pid}" data-k="${k}" aria-label="${LABEL[k]} ＋1">＋</button></div>`; }
function warnServe(s){ return s[1] + s[2] + s[3] > s[0]; }
function warnSpike(s){ return s[5] + s[6] > s[4]; }
function recTable(m, st, roster){
  const tot = zero();
  const rows = roster.map(r => { const s = st.stats[r.playerId] || (st.stats[r.playerId] = zero()); addInto(tot, s);
    return `<tr id="row_${r.playerId}"><th class="c-name"><div class="pn"><span class="num">${esc(r.number || '-')}</span><span class="nm">${esc(r.name)}</span></div></th>${s.map((v, k) => `<td id="td_${r.playerId}_${k}" class="${(k === 0 && warnServe(s)) || (k === 4 && warnSpike(s)) ? 'warn' : ''}">${ctr(r.playerId, k, v)}</td>`).join('')}<td class="ev ${serveEval(s) < 0 ? 'neg' : ''}" id="ie_${r.playerId}">${fmtPct(serveEval(s))}</td><td class="ev ${spikeEval(s) < 0 ? 'neg' : ''}" id="je_${r.playerId}">${fmtPct(spikeEval(s))}</td></tr>`; }).join('');
  return `<table class="rec">${thead()}<tbody>${rows}</tbody><tfoot><tr><th class="c-name">チーム合計</th>${tot.map((v, k) => `<td class="ro" id="t_${k}">${v}</td>`).join('')}<td class="ev" id="t_i">${fmtPct(serveEval(tot))}</td><td class="ev" id="t_j">${fmtPct(spikeEval(tot))}</td></tr></tfoot></table>`;
}
function recCard(r, s){
  const cell = k => `<div class="cc ${k < 4 ? 'sv' : 'sp'} ${(k === 0 && warnServe(s)) || (k === 4 && warnSpike(s)) ? 'warn' : ''}" id="td_${r.playerId}_${k}"><div class="lb">${COLS[k]} ${LABEL[k]}</div><span class="val" id="v_${r.playerId}_${k}">${s[k]}</span><div class="bb"><button class="bm" data-act="dec" data-pid="${r.playerId}" data-k="${k}" aria-label="${LABEL[k]} −1">−</button><button class="bp ${k < 4 ? 'sv' : 'sp'}" data-act="inc" data-pid="${r.playerId}" data-k="${k}" aria-label="${LABEL[k]} ＋1">＋</button></div></div>`;
  return `<div class="pcard" id="card_${r.playerId}"><div class="pc-head"><span class="num">${esc(r.number || '-')}</span><span class="nm">${esc(r.name)}</span><span class="pc-ev">サーブ評価 <b id="ie_${r.playerId}" class="${serveEval(s) < 0 ? 'neg' : ''}">${fmtPct(serveEval(s))}</b><br>スパイク評価 <b id="je_${r.playerId}" class="${spikeEval(s) < 0 ? 'neg' : ''}">${fmtPct(spikeEval(s))}</b></span></div>
  <div class="pc-row s4">${[0,1,2,3].map(cell).join('')}</div><div class="pc-row s3">${[4,5,6].map(cell).join('')}</div></div>`;
}
function cardFoot(st, roster){ const tot = zero(); roster.forEach(r => addInto(tot, st.stats[r.playerId])); return `<div class="cfoot"><span>チーム合計</span>${tot.map((v, k) => `<span>${SHORT[k]} <b id="t_${k}">${v}</b></span>`).join('')}<span>I <b id="t_i">${fmtPct(serveEval(tot))}</b></span><span>J <b id="t_j">${fmtPct(spikeEval(tot))}</b></span></div>`; }
function roTable(agg){
  return `<table class="rec">${thead()}<tbody>${agg.rows.map(o => `<tr><th class="c-name"><div class="pn"><span class="num">${esc(o.number || '-')}</span><span class="nm">${esc(o.name)}</span></div></th>${o.s.map(v => `<td class="ro">${v}</td>`).join('')}<td class="ev ${serveEval(o.s) < 0 ? 'neg' : ''}">${fmtPct(serveEval(o.s))}</td><td class="ev ${spikeEval(o.s) < 0 ? 'neg' : ''}">${fmtPct(spikeEval(o.s))}</td></tr>`).join('')}</tbody><tfoot><tr><th class="c-name">チーム合計</th>${agg.total.map(v => `<td class="ro">${v}</td>`).join('')}<td class="ev">${fmtPct(serveEval(agg.total))}</td><td class="ev">${fmtPct(spikeEval(agg.total))}</td></tr></tfoot></table>`;
}
function undoFor(mid){ for (let i = ui.undo.length - 1; i >= 0; i--) if (ui.undo[i].mid === mid) return ui.undo[i]; return null; }
function undoLabel(mid){ const u = undoFor(mid); if (!u) return ''; const m = S.matches.get(mid); const r = m && m.roster.find(x => x.playerId === u.pid); return `直前: 第${u.set+1}S ${r ? r.name : ''} ${u.ch.map(([k, d]) => SHORT[k] + (d > 0 ? '+' : '−') + '1').join(' ')}`; }
function bump(pid, k, d){
  const c = ui.cur; if (!c || c.set === 'total') return;
  const m = S.matches.get(c.mid); const st = m.sets[c.set]; const s = st.stats[pid] || (st.stats[pid] = zero());
  const ch = [];
  const apply = (kk, dd) => { if (dd < 0 && s[kk] <= 0) return false; s[kk] += dd; ch.push([kk, dd]); return true; };
  if (!apply(k, d)) { navigator.vibrate && navigator.vibrate(30); return; }
  if (S.settings.linkServe && [1, 2, 3].includes(k)) { if (d > 0) apply(0, 1); else if (s[0] > s[1] + s[2] + s[3]) apply(0, -1); }
  if (S.settings.linkSpike && [5, 6].includes(k)) { if (d > 0) apply(4, 1); else if (s[4] > s[5] + s[6]) apply(4, -1); }
  ui.undo.push({ mid: m.id, set: c.set, pid, ch }); if (ui.undo.length > 300) ui.undo.shift();
  saveMatch(m);
  refreshCells(m, st, pid, ch.map(x => x[0]));
  navigator.vibrate && navigator.vibrate(8);
}
function refreshCells(m, st, pid, keys){
  const s = st.stats[pid];
  keys.forEach(k => { const el = document.getElementById(`v_${pid}_${k}`); if (el) { el.textContent = s[k]; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } });
  const w0 = document.getElementById(`td_${pid}_0`), w4 = document.getElementById(`td_${pid}_4`);
  if (w0) w0.classList.toggle('warn', warnServe(s)); if (w4) w4.classList.toggle('warn', warnSpike(s));
  const ie = document.getElementById(`ie_${pid}`), je = document.getElementById(`je_${pid}`);
  if (ie) { ie.textContent = fmtPct(serveEval(s)); ie.classList.toggle('neg', serveEval(s) < 0); }
  if (je) { je.textContent = fmtPct(spikeEval(s)); je.classList.toggle('neg', spikeEval(s) < 0); }
  const tot = zero(); m.roster.forEach(r => addInto(tot, st.stats[r.playerId]));
  tot.forEach((v, k) => { const e = document.getElementById(`t_${k}`); if (e) e.textContent = v; });
  const ti = document.getElementById('t_i'), tj = document.getElementById('t_j');
  if (ti) ti.textContent = fmtPct(serveEval(tot)); if (tj) tj.textContent = fmtPct(spikeEval(tot));
  const ub = document.getElementById('undobtn'); if (ub) ub.disabled = !undoFor(m.id);
  const ul = document.getElementById('undolbl'); if (ul) ul.textContent = undoLabel(m.id);
}
ACT.inc = el => bump(el.dataset.pid, +el.dataset.k, 1);
ACT.dec = el => bump(el.dataset.pid, +el.dataset.k, -1);
ACT.undo = () => {
  const c = ui.cur; if (!c) return; let idx = -1;
  for (let i = ui.undo.length - 1; i >= 0; i--) if (ui.undo[i].mid === c.mid) { idx = i; break; }
  if (idx < 0) return;
  const u = ui.undo.splice(idx, 1)[0]; const m = S.matches.get(u.mid); const st = m.sets[u.set]; if (!st) return;
  const s = st.stats[u.pid];
  u.ch.slice().reverse().forEach(([k, d]) => { s[k] = Math.max(0, s[k] - d); });
  saveMatch(m);
  if (c.set !== u.set) { toast(`第${u.set+1}セットの入力を取り消しました`); history.replaceState(null, '', `#match/${m.id}/${u.set}`); render(); return; }
  refreshCells(m, st, u.pid, u.ch.map(x => x[0]));
  toast('1つ前の入力を取り消しました', 1200);
};

function addRosterDlg(m){

    const m = S.matches.get(st.mid);
    let extra = '', agg;
    if (mode === 'set') { if (st.si == null || st.si >= m.sets.length) st.si = 0; extra = `<div class="chips" style="margin-top:8px">${m.sets.map((s, i) => `<button class="chip ${st.si === i ? 'on' : ''}" data-act="statSet" data-i="${i}">第${i+1}セット${setScoreText(s) !== '未入力' ? '（' + setScoreText(s) + '）' : ''}</button>`).join('')}</div>`; agg = aggregate(itemsSet(m, st.si)); }
    else agg = aggregate(itemsMatch(m));
    body = `<div class="card"><label class="f" style="margin-top:0">試合</label>${matchSelect(st.mid, 'statMatch')}${extra}<div class="row" style="margin-top:8px"><a class="btn sm" href="#match/${m.id}/${mode === 'set' ? st.si : 'total'}">この試合の記録画面へ</a></div></div>${statTable(agg)}`;
  } else if (mode === 'day') {
    const dates = [...new Set(ms.map(m => m.date))];
    if (!st.date || !dates.includes(st.date)) st.date = dates[0];
    const items = itemsDay(st.date);
    body = `<div class="card"><label class="f" style="margin-top:0">日付</label><select data-change="statDate">${dates.map(d => `<option value="${d}" ${d === st.date ? 'selected' : ''}>${fmtDate(d)}（${ms.filter(m => m.date === d).length}試合）</option>`).join('')}</select><p class="muted">対象：${items.map(x => esc(`vs ${x.match.opponent || '?'}（${x.match.sets.length}セット）`)).join('、')}</p></div>${statTable(aggregate(items))}`;
  } else if (mode === 'period') {
    const p = ui.per; const A = itemsPeriod(p.start, p.end, p.kinds); const aggA = aggregate(A);
    body = `<div class="card">${perControls(p)}</div><h3>${p.cmp ? '期間A：' : ''}${perLabel(p.start, p.end)}　<span class="muted">${A.length}試合・${A.reduce((n, x) => n + x.match.sets.length, 0)}セット</span></h3>${statTable(aggA)}`;
    if (p.cmp) {
      const B = itemsPeriod(p.start2, p.end2, p.kinds); const aggB = aggregate(B); const cr = compareRows(aggA, aggB);
      const dc = v => `<td class="${v > 0.049 ? 'diffp' : v < -0.049 ? 'diffn' : ''}">${fmtDiff(v)}</td>`;
      body += `<h3>期間B：${perLabel(p.start2, p.end2)}　<span class="muted">${B.length}試合</span></h3>${statTable(aggB)}
      <h3>期間比較（B − A）</h3><div class="tw"><table class="st"><thead><tr><th class="c-name">選手名</th><th class="hs">サーブ評価 A</th><th class="hs">サーブ評価 B</th><th class="hs">差</th><th class="hp">スパイク評価 A</th><th class="hp">スパイク評価 B</th><th class="hp">差</th><th>打数 A/B</th><th>本数 A/B</th></tr></thead><tbody>
      ${cr.map(c => `<tr><th class="c-name"><span class="num">${esc(c.number || '-')}</span> ${esc(c.name)}</th><td>${fmtPct(c.ia)}</td><td>${fmtPct(c.ib)}</td>${dc(c.ib - c.ia)}<td>${fmtPct(c.ja)}</td><td>${fmtPct(c.jb)}</td>${dc(c.jb - c.ja)}<td>${c.a[0]} / ${c.b[0]}</td><td>${c.a[4]} / ${c.b[4]}</td></tr>`).join('')}
      <tr><th class="c-name">チーム合計</th><td>${fmtPct(serveEval(aggA.total))}</td><td>${fmtPct(serveEval(aggB.total))}</td>${dc(serveEval(aggB.total) - serveEval(aggA.total))}<td>${fmtPct(spikeEval(aggA.total))}</td><td>${fmtPct(spikeEval(aggB.total))}</td>${dc(spikeEval(aggB.total) - spikeEval(aggA.total))}<td>${aggA.total[0]} / ${aggB.total[0]}</td><td>${aggA.total[4]} / ${aggB.total[4]}</td></tr></tbody></table></div>`;
    }
  } else if (mode === 'player') {
    const all = [...S.players.values()].sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    if (!all.length) body = '<p class="muted">選手が登録されていません。</p>';
    else {
      const pid = (args[1] && S.players.get(args[1])) ? args[1] : (st.pid && S.players.get(st.pid) ? st.pid : all[0].id); st.pid = pid;
      const mine = matchesSorted().filter(m => m.roster.some(r => r.playerId === pid));
      const byYear = new Map(); mine.forEach(m => { if (!byYear.has(m.year)) byYear.set(m.year, []); byYear.get(m.year).push({ match: m, setIdx: null }); });
      const yrRows = [...byYear.entries()].sort((a, b) => b[0] - a[0]).map(([y, items]) => { const a = aggregate(items).rows.find(o => o.pid === pid); return { name: `${y}年度（${items.length}試合）`, number: null, s: a ? a.s : zero(), pid }; });
      const yTot = zero(); yrRows.forEach(r => addInto(yTot, r.s));
      const mRows = mine.map(m => { const a = aggregate(itemsMatch(m)).rows.find(o => o.pid === pid); return { name: `${m.date.slice(5).replace('-', '/')} ${m.opponent || ''}`, number: null, s: a.s, pid }; });
      const mTot = zero(); mRows.forEach(r => addInto(mTot, r.s));
      body = `<div class="card"><label class="f" style="margin-top:0">選手（引退・OBを含む）</label><select data-change="statPlayer">${all.map(p => `<option value="${p.id}" ${p.id === pid ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
      ${mine.length ? `<h3>年度別</h3>${statTable({ rows: yrRows, total: yTot }, { sortable: false, firstLabel: '年度' })}<h3>試合ごと（新しい順）</h3>${statTable({ rows: mRows, total: mTot }, { sortable: false, firstLabel: '試合' })}` : '<p class="muted">この選手の試合記録はまだありません。</p>'}`;
    }
  }
  app.innerHTML = `<div class="seg">${seg}</div>${body}`;
};

function validateBackup(d){
  if (!d || d.app !== 'vb-stats' || !Array.isArray(d.players) || !Array.isArray(d.matches) || !Array.isArray(d.seasons)) throw new Error('このアプリのバックアップファイルではありません');
  d.matches.forEach(m => { if (!m.id || !m.date || !Array.isArray(m.roster) || !Array.isArray(m.sets)) throw new Error('試合データの形式が正しくありません'); });
  d.players.forEach(p => { if (!p.id || typeof p.name !== 'string') throw new Error('選手データの形式が正しくありません'); });
  return d;
}

  modal({ title: 'バックアップの内容', html: `<dl class="kv"><dt>作成日時</dt><dd>${d.exportedAt ? new Date(d.exportedAt).toLocaleString('ja-JP') : '不明'}</dd><dt>選手</dt><dd>${d.players.length}名</dd><dt>年度名簿</dt><dd>${d.seasons.map(s => s.year + '年度').join('・')}</dd><dt>試合</dt><dd>${d.matches.length}件</dd></dl>

    buttons: [{ label: 'キャンセル' }, { label: '統合（追加）', onClick: async () => { await makeSnapshot('統合前の自動退避'); const r = mergeData(d); await flushNow(); render(); toast(`統合しました（試合 追加${r.add}・更新${r.upd}）`, 3500); } },
      { label: '置き換えて復元', cls: 'danger solid', onClick: async () => {
        if (!(await confirmDlg('置き換えの確認', `この端末の現在のデータ（選手${S.players.size}名・試合${S.matches.size}件）は、ファイルの内容（選手${d.players.length}名・試合${d.matches.length}件）に置き換わります。<br>よろしいですか？`, { ok: '置き換える', danger: true }))) return;
        await makeSnapshot('復元前の自動退避'); await replaceAllData(d); render(); toast('復元しました', 3000); } }] });
};
function mergeData(d){
  let add = 0, upd = 0;
  d.players.forEach(p => { const ex = S.players.get(p.id); if (!ex) { S.players.set(p.id, p); markDirty('players', p.id); } else if ((p.updatedAt || 0) > (ex.updatedAt || 0)) { S.players.set(p.id, p); markDirty('players', p.id); } });
  d.seasons.forEach(s0 => { const s = { ...s0, year: +s0.year }; const ex = S.seasons.get(s.year); if (!ex) { S.seasons.set(s.year, s); markDirty('seasons', s.year); } else { let ch = false; s.entries.forEach(e => { if (!ex.entries.some(x => x.playerId === e.playerId)) { ex.entries.push(e); ch = true; } }); if (ch) saveSeason(ex); } });
  d.matches.forEach(m0 => { const m = normalizeMatch(clone(m0)); const ex = S.matches.get(m.id); if (!ex) { S.matches.set(m.id, m); markDirty('matches', m.id); add++; } else if ((m.updatedAt || 0) > (ex.updatedAt || 0)) { S.matches.set(m.id, m); markDirty('matches', m.id); upd++; } });
  return { add, upd };
}

async function init(){
  try { db = await openDB(); } catch (e) { console.warn('IndexedDB unavailable, fallback to localStorage', e); fallback = true; }
  try { await loadAll(); } catch (e) { console.error(e); fallback = true; await loadAll(); }
  setSaveState('saved');
  if (!fallback && !S.players.size && !S.matches.size) {
    const mir = readMirror();
    if (mir && ((mir.matches && mir.matches.length) || (mir.players && mir.players.length))) {
      const ok = await confirmDlg('データの復旧', `端末内の予備コピーに記録（選手${mir.players.length}名・試合${mir.matches.length}件）が見つかりました。復旧しますか？`, { ok: '復旧する' });
      if (ok) await replaceAllData(mir);
    }
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  const t = todayStr();
  if (!fallback && S.lastSnapDate !== t && S.matches.size) { try { await makeSnapshot('自動（その日の初回起動時）'); S.lastSnapDate = t; saveMeta('lastSnapDate'); } catch (e) {} }
  render();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => { const nw = reg.installing; if (!nw) return; nw.addEventListener('statechange', () => { if (nw.state === 'activated' && navigator.serviceWorker.controller) toast('アプリを更新しました。次回起動時から新しい版になります', 4000); }); });
    }).catch(e => console.warn('SW登録失敗', e));
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { flushNow(); writeMirror(); } });
window.addEventListener('pagehide', () => { writeMirror(); });

init();
